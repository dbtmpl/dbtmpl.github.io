<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main" class="page">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.squirrel %}<script src="{{ '/assets/js/squirrel.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
  {% if page.asset_base %}<script>window.POST_ASSET_BASE = {{ page.asset_base | relative_url | jsonify }};</script>{% endif %}
  {% if page.custom_js %}{% for js in page.custom_js %}
  <script src="{{ js | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% endfor %}{% endif %}
</body>
</html>
