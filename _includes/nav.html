{%- assign home = '/' | relative_url -%}
{%- if page.url == '/' -%}{%- assign prefix = '' -%}{%- else -%}{%- assign prefix = home -%}{%- endif -%}
<header class="topbar">
  <nav class="topbar__inner" aria-label="Main">
    <a class="topbar__logo" href="{{ home }}">dbtmpl</a>
    <ul class="topbar__links">
      <li class="nav-about"><a href="{{ prefix }}#about">About</a></li>
      <li><a href="{{ prefix }}#research">Research</a></li>
      <li><a href="{{ prefix }}#projects">Projects</a></li>
      <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a></li>
      <li><a href="{{ '/assets/cv.pdf' | relative_url }}">CV</a></li>
    </ul>
  </nav>
</header>
