title: David Biertimpel
author: David Biertimpel
description: Machine learning engineer working on perception, MLOps and generative modelling.
url: "https://dbtmpl.github.io"
baseurl: ""
lang: en

# Shown in the header and footer
tagline: Machine Learning Engineer
social:
  github: dbtmpl
  twitter: dbtmpl
  linkedin: david-biertimpel
  scholar: AIu7ihgAAAAJ

# Build settings
markdown: kramdown
highlighter: rouge
excerpt_separator: <!--more-->
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  math_engine: mathjax   # emits \( \) and \[ \]; KaTeX renders them in the browser

permalink: /blog/:year/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: blog/feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, math: true }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - .idea
